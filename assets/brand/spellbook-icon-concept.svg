<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">Spellbook icon concept: Prompt Grimoire</title>
  <desc id="d">Approved concept, 2026-10-04. An open book on a blue cover. The left page carries a blue AI sparkle with a small companion sparkle, the right page two text lines ending in a gold cursor. No star, no glow. Source sketch for D05 T02 section 1; the production master is drawn from it.</desc>
