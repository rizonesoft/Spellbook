      <stop offset="0" stop-color="#FFFAEE"/>
      <stop offset="1" stop-color="#EBDDBD"/>
    </linearGradient>
    <linearGradient id="sparkBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D86FF"/><stop offset="1" stop-color="#0F45B8"/></linearGradient>
  </defs>
